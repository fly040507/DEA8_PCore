<rect x="40" y="1130" width="2715" height="180" rx="6" fill="#f8fafc" stroke="#94a0b2"/>
<text x="65" y="1158" class="lane" text-anchor="start">并行关系与边界</text>
<text x="65" y="1185" class="note" text-anchor="start">1. Q、K、V、QK、PV、O、Gate、Up、Down 共用每核同一 MAC，因此这些矩阵阶段在核内不能相互并行。</text>
<text x="65" y="1209" class="note" text-anchor="start">2. “8 核并行”指 8 个核同步工作：Q 各算一个完整 Head；K/V 各算 32-d slice；O/Down 各算同一输出的 K-slice partial。</text>
<text x="65" y="1233" class="note" text-anchor="start">3. Online Softmax 的 max/exp/rowsum/O_tilde 更新与 QK/PV block 重叠；解析关键路径只增加最后 512 cycles。</text>
<text x="65" y="1257" class="note" text-anchor="start">4. SUM Tree 连续吞吐 8x256-bit partial，6528-cycle payload 已包含在 O/Down 输出阶段，只额外增加 3-cycle tail。</text>
<text x="65" y="1281" class="note" text-anchor="start">5. 当前 401,990-cycle 基线不含 VLM、state/action/time 投影和 action_out_proj；这些模块可复用 8 核阵列，但需另排时间。</text>
</svg>