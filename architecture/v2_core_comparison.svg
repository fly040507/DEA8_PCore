<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <style>
      .title { font:700 30px "Microsoft YaHei", Arial, sans-serif; fill:#14213d; }
      .sub { font:16px "Microsoft YaHei", Arial, sans-serif; fill:#475569; }
      .label { font:700 19px "Microsoft YaHei", Arial, sans-serif; fill:#14213d; }
      .small { font:15px "Microsoft YaHei", Arial, sans-serif; fill:#334155; }
      .tiny { font:13px "Microsoft YaHei", Arial, sans-serif; fill:#334155; }
      .panel { fill:#f8fbff; stroke:#1769aa; stroke-width:2; }
      .good { fill:#e0f2e3; stroke:#2e7d32; stroke-width:2; }
      .warn { fill:#fff1d6; stroke:#cf6a15; stroke-width:2; }
      .bad { fill:#fde2e2; stroke:#b42318; stroke-width:2; }
    </style>
  </defs>
  <rect width="1600" height="960" fill="#ffffff"/>
  <text x="55" y="55" class="title">4 / 8 / 16 核对比：为什么冻结 8 核</text>
  <text x="55" y="84" class="sub">公平比较固定私有 DSP 总量 4096，另加共享 K/V 512 DSP；250 MHz 解析模型</text>

  <rect x="55" y="120" width="470" height="535" rx="5" class="panel"/>
  <text x="290" y="158" text-anchor="middle" class="label">4 核：每核两个完整 Head</text>
  <text x="290" y="188" text-anchor="middle" class="small">每核阵列 32×32，1024 DSP</text>
  <g>
    <rect x="100" y="225" width="170" height="92" rx="4" fill="#dceeff" stroke="#1769aa" stroke-width="2"/>
    <text x="185" y="253" text-anchor="middle" class="small">Core 0</text>
    <text x="185" y="281" text-anchor="middle" class="tiny">Head 0 + Head 1</text>
    <rect x="310" y="225" width="170" height="92" rx="4" fill="#dceeff" stroke="#1769aa" stroke-width="2"/>
    <text x="395" y="253" text-anchor="middle" class="small">Core 1</text>
    <text x="395" y="281" text-anchor="middle" class="tiny">Head 2 + Head 3</text>
    <rect x="100" y="345" width="170" height="92" rx="4" fill="#dceeff" stroke="#1769aa" stroke-width="2"/>
    <text x="185" y="373" text-anchor="middle" class="small">Core 2</text>
    <text x="185" y="401" text-anchor="middle" class="tiny">Head 4 + Head 5</text>
    <rect x="310" y="345" width="170" height="92" rx="4" fill="#dceeff" stroke="#1769aa" stroke-width="2"/>
    <text x="395" y="373" text-anchor="middle" class="small">Core 3</text>
    <text x="395" y="401" text-anchor="middle" class="tiny">Head 6 + Head 7</text>
  </g>
  <text x="85" y="486" class="small">层延迟：1.877 ms</text>
  <text x="85" y="516" class="small">归约树深度：2</text>
  <text x="85" y="546" class="small">问题：N 分片较宽，阵列边缘利用率较差</text>
  <text x="85" y="576" class="small">结论：可实现，但比 8 核慢约 5.3%</text>
  <rect x="85" y="603" width="410" height="34" rx="3" class="warn"/>
  <text x="290" y="626" text-anchor="middle" class="small">可行，但不是性能/映射最优点</text>

  <rect x="565" y="120" width="470" height="535" rx="5" class="good"/>
  <text x="800" y="158" text-anchor="middle" class="label">8 核：一核一个完整 Head</text>
  <text x="800" y="188" text-anchor="middle" class="small">每核阵列 8×64，512 DSP</text>
  <g fill="#bfe0fa" stroke="#1769aa" stroke-width="1.8">
    <rect x="610" y="225" width="86" height="78" rx="3"/><rect x="708" y="225" width="86" height="78" rx="3"/>
    <rect x="806" y="225" width="86" height="78" rx="3"/><rect x="904" y="225" width="86" height="78" rx="3"/>
    <rect x="610" y="323" width="86" height="78" rx="3"/><rect x="708" y="323" width="86" height="78" rx="3"/>
    <rect x="806" y="323" width="86" height="78" rx="3"/><rect x="904" y="323" width="86" height="78" rx="3"/>
  </g>
  <g class="tiny" text-anchor="middle">
    <text x="653" y="258">C0</text><text x="653" y="282">H0</text>
    <text x="751" y="258">C1</text><text x="751" y="282">H1</text>
    <text x="849" y="258">C2</text><text x="849" y="282">H2</text>
    <text x="947" y="258">C3</text><text x="947" y="282">H3</text>
    <text x="653" y="356">C4</text><text x="653" y="380">H4</text>
    <text x="751" y="356">C5</text><text x="751" y="380">H5</text>
    <text x="849" y="356">C6</text><text x="849" y="380">H6</text>
    <text x="947" y="356">C7</text><text x="947" y="380">H7</text>
  </g>
  <text x="595" y="456" class="small">层延迟：1.783 ms（最优）</text>
  <text x="595" y="486" class="small">归约树深度：3</text>
  <text x="595" y="516" class="small">QK/Softmax/S×V 均在单核内完成</text>
  <text x="595" y="546" class="small">主 MAC：4608 DSP，余量 1344</text>
  <text x="595" y="576" class="small">控制、广播、地址映射最规则</text>
  <rect x="595" y="603" width="410" height="34" rx="3" fill="#b7e4b9" stroke="#2e7d32"/>
  <text x="800" y="626" text-anchor="middle" class="small">冻结方案：性能、资源、复杂度平衡最好</text>

  <rect x="1075" y="120" width="470" height="535" rx="5" class="panel"/>
  <text x="1310" y="158" text-anchor="middle" class="label">16 核：每个 Head 拆成两半</text>
  <text x="1310" y="188" text-anchor="middle" class="small">每核阵列 8×32，256 DSP</text>
  <g fill="#dceeff" stroke="#1769aa" stroke-width="1.5">
    <rect x="1110" y="225" width="45" height="67"/><rect x="1159" y="225" width="45" height="67"/>
    <rect x="1215" y="225" width="45" height="67"/><rect x="1264" y="225" width="45" height="67"/>
    <rect x="1320" y="225" width="45" height="67"/><rect x="1369" y="225" width="45" height="67"/>
    <rect x="1425" y="225" width="45" height="67"/><rect x="1474" y="225" width="45" height="67"/>
    <rect x="1110" y="315" width="45" height="67"/><rect x="1159" y="315" width="45" height="67"/>
    <rect x="1215" y="315" width="45" height="67"/><rect x="1264" y="315" width="45" height="67"/>
    <rect x="1320" y="315" width="45" height="67"/><rect x="1369" y="315" width="45" height="67"/>
    <rect x="1425" y="315" width="45" height="67"/><rect x="1474" y="315" width="45" height="67"/>
  </g>
  <g class="tiny" text-anchor="middle">
    <text x="1157" y="407">H0</text><text x="1262" y="407">H1</text><text x="1367" y="407">H2</text><text x="1472" y="407">H3</text>
    <text x="1157" y="431">H4</text><text x="1262" y="431">H5</text><text x="1367" y="431">H6</text><text x="1472" y="431">H7</text>
  </g>
  <text x="1105" y="466" class="small">层延迟：1.784 ms（仅快于 4 核）</text>
  <text x="1105" y="496" class="small">归约树深度：4</text>
  <text x="1105" y="526" class="small">QK 分数需两半求和后才能 Softmax</text>
  <text x="1105" y="556" class="small">Softmax 结果还要广播回两个半 Head</text>
  <text x="1105" y="586" class="small">布线与同步复杂度显著增加</text>
  <rect x="1105" y="603" width="410" height="34" rx="3" class="warn"/>
  <text x="1310" y="626" text-anchor="middle" class="small">没有实质延迟收益，不采用</text>

  <rect x="55" y="700" width="1490" height="205" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="735" class="label">另一个更直接的 DSP 检查：若三种方案都沿用 8×64 的同构核</text>
  <rect x="90" y="770" width="400" height="82" rx="4" class="good"/>
  <text x="290" y="800" text-anchor="middle" class="small">4 核：2048 私有 + 512 共享</text>
  <text x="290" y="830" text-anchor="middle" class="small">能放下，但计算吞吐不足</text>
  <rect x="600" y="770" width="400" height="82" rx="4" class="good"/>
  <text x="800" y="800" text-anchor="middle" class="small">8 核：4096 私有 + 512 共享</text>
  <text x="800" y="830" text-anchor="middle" class="small">4608 DSP，适配 5952 DSP</text>
  <rect x="1110" y="770" width="400" height="82" rx="4" class="bad"/>
  <text x="1310" y="800" text-anchor="middle" class="small">16 核：8192 私有 + 512 共享</text>
  <text x="1310" y="830" text-anchor="middle" class="small">8704 DSP，物理上无法实现</text>
  <text x="80" y="884" class="tiny">解析延迟不含 RMSNorm、RoPE、GeGLU、Residual、Host 开销和时序收敛影响；用于架构选择，不替代综合与板上测量。</text>
</svg>
